name: Demo Studio local synthetic screenshot contracts (not screenshot capture)

on:
  pull_request:
    paths:
      - 'scripts/capture-local-browser.mjs'
      - 'scripts/capture-local-browser.test.mjs'
      - 'scripts/capture-local-browser.real.test.mjs'
      - '.github/workflows/local-synthetic-capture-tests.yml'

permissions:
  contents: read

jobs:
  capture-contracts:
    if: github.event.pull_request.head.repo.full_name == 'leorami/demo-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch exact proposed source without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm JavaScript parser
        run: node --check scripts/capture-local-browser.mjs
      - name: Check RED-first local and negative source/identity cases
        run: node --test scripts/capture-local-browser.test.mjs

# No real browser, signed-in app, native Mac, media, capture, upload, secrets or deploy.
# These source-fixture tests alone NEVER establish owner UI or screenshot success.

  real-synthetic-browser:
    if: github.event.pull_request.head.repo.full_name == 'leorami/demo-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact proposed source without persistent credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser automation only into ephemeral CI node_modules
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.55.0
      - name: Require an already installed system Chromium without downloads
        shell: bash
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER" || { echo 'SYSTEM_CHROMIUM_UNAVAILABLE'; exit 1; }
          echo "DEMO_STUDIO_REAL_BROWSER=$BROWSER" >> "$GITHUB_ENV"
      - name: Capture ONLY explicitly synthetic local real-Chromium pages
        env:
          DEMO_STUDIO_SYNTHETIC_ARTIFACT_DIR: ${{ github.workspace }}/synthetic-capture-proof
        run: node --test scripts/capture-local-browser.real.test.mjs
      - name: Publish synthetic proof only (no Calliope or owner-private media)
        uses: actions/upload-artifact@v4
        with:
          name: demo-studio-SYNTHETIC-chromium-${{ github.event.pull_request.head.sha }}
          path: synthetic-capture-proof/
          if-no-files-found: error
          retention-days: 7

# Browser pixels in this job are from an ephemeral, public-safe HTML fixture.
# They are never actual Calliope native WKWebView or owner UAT evidence.
